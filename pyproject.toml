[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paralegal-voice-agents"
version = "0.1.0"
description = "AI-assisted family-law lead intake service for Indian law firms."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<51",
  "fastapi>=0.115,<1.0",
  "google-cloud-storage>=2.18,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "pymongo>=4.10,<5.0",
  "uvicorn[standard]>=0.30,<1.0",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

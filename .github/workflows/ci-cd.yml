name: CI and Cloud Run deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install uv==0.10.7
          uv sync --frozen --extra dev
      - name: Lint and test
        working-directory: backend
        run: |
          uv run --no-sync ruff check . ../tests
          uv run --no-sync pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  deploy:
    name: Deploy backend
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cloud-run-production
      cancel-in-progress: false
    env:
      PROJECT_ID: equaleum-505014
      REGION: asia-south1
      SERVICE: paralegal-voice-agent
      IMAGE: asia-south1-docker.pkg.dev/equaleum-505014/cloud-run-source-deploy/paralegal-voice-agent
    steps:
      - uses: actions/checkout@v4
      - name: Skip an outdated commit
        id: current
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer commit is already on main; skipping this deployment.'
          fi
      - name: Build image
        if: steps.current.outputs.deploy == 'true'
        run: docker build -f backend/Dockerfile -t "$IMAGE:$GITHUB_SHA" .
      - name: Authenticate to Google Cloud
        if: steps.current.outputs.deploy == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/553194048395/locations/global/workloadIdentityPools/github-actions/providers/paralegal-github
          service_account: paralegal-ci@equaleum-505014.iam.gserviceaccount.com
      - name: Set up Google Cloud CLI
        if: steps.current.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@v3
      - name: Push image and deploy
        if: steps.current.outputs.deploy == 'true'
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE:$GITHUB_SHA"
          gcloud run services update "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --image="$IMAGE:$GITHUB_SHA" --quiet
